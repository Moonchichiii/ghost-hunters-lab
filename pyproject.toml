[project]
name = "ghost-hunters-lab"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mats Gustafsson", email = "matgus1983@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gguf",
    "numpy>=2.2",
    "safetensors>=0.7",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.uv.sources]
gguf = { path = "/home/masse/src/llama.cpp/gguf-py", editable = true }


[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/ghost_lab"]