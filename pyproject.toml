[project]
name = "ghost-hunters-lab"
version = "0.1.0"
description = "A local AI interpretability lab for discovering, steering, and measuring features inside Gemma."
authors = [
    { name = "Mats Gustafsson", email = "matgus1983@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "gguf==0.19.0",
    "jinja2>=3.1.6",
    "numpy>=2.2",
    "safetensors>=0.7",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.uv.build-backend]
module-name = "ghost_lab"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/ghost_lab"]
